name: Build APKs for release

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI (arsitektur CPU)"
        required: true
        default: "mix"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - mix
          - split
      add_to_release_tag:
        description: "Add to GitHub Release Tag?"
        required: true
        default: true
        type: boolean
      tag_name:
        description: "Release Tag Name (contoh: v1.0.0) — kosongkan untuk auto"
        required: false
        default: ""
      prerelease:
        description: "Tandai sebagai Pre-release?"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Repair & Download Official Gradle Wrapper
        run: |
          echo "=== Verifying Gradle Wrapper ==="
          if [ ! -f gradlew ]; then
            PROP_FILE="gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$PROP_FILE" ]; then
              WRAPPER_URL=$(grep -o 'https.*\.zip' "$PROP_FILE" | sed 's/\\//g')
            fi
            WRAPPER_URL="${WRAPPER_URL:-https://services.gradle.org/distributions/gradle-9.3.1-bin.zip}"
            echo "Fetching clean Gradle from: $WRAPPER_URL"

            TMP_DIR=$(mktemp -d)
            curl -sSL "$WRAPPER_URL" -o "$TMP_DIR/gradle.zip"
            unzip -q -o "$TMP_DIR/gradle.zip" -d "$TMP_DIR"

            GRADLE_BIN=$(find "$TMP_DIR" -type f -name gradle | head -1)
            chmod +x "$GRADLE_BIN"
            echo "Using official Gradle binary at: $GRADLE_BIN"

            "$GRADLE_BIN" wrapper --gradle-version 9.3.1 --distribution-type bin --no-daemon
            "$GRADLE_BIN" --stop 2>/dev/null || true
            rm -rf "$TMP_DIR"
          fi

          chmod +x gradlew
          echo "Verifying Gradle wrapper:"
          ./gradlew --version

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Signing Keystore
        run: |
          KEY_PASS="${{ secrets.KEY_PASSWORD || 'android' }}"
          STORE_PASS="${{ secrets.STORE_PASSWORD || 'android' }}"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          elif [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE..."
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            echo "Generating self-contained release keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PhotoStand, OU=Mobile, O=PhotoStand, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Patch ABI Configuration in build.gradle.kts
        run: |
          ABI="${{ inputs.abi || 'mix' }}"
          python3 - app/build.gradle.kts "$ABI" <<'PYEOF'
          import sys, re
          path, abi = sys.argv[1], sys.argv[2]
          content = open(path).read()

          if abi == 'split':
              content = re.sub(
                  r'splits\s*\{[^}]*abi\s*\{[^}]*isEnable\s*=\s*(true|false)',
                  'splits {\n    abi {\n      isEnable = true',
                  content
              )
              content = re.sub(r'include\([^)]*\)', 'include("arm64-v8a", "armeabi-v7a")', content)
          elif abi == 'mix':
              content = re.sub(
                  r'splits\s*\{[^}]*abi\s*\{[^}]*isEnable\s*=\s*(true|false)',
                  'splits {\n    abi {\n      isEnable = false',
                  content
              )
              content = re.sub(
                  r'abiFilters\s*\+=\s*listOf\([^)]*\)',
                  'abiFilters += listOf("arm64-v8a", "armeabi-v7a")',
                  content
              )
          elif abi in ['arm64-v8a', 'armeabi-v7a']:
              content = re.sub(
                  r'splits\s*\{[^}]*abi\s*\{[^}]*isEnable\s*=\s*(true|false)',
                  'splits {\n    abi {\n      isEnable = false',
                  content
              )
              content = re.sub(
                  r'abiFilters\s*\+=\s*listOf\([^)]*\)',
                  f'abiFilters += listOf("{abi}")',
                  content
              )

          open(path, 'w').write(content)
          print(f"ABI configured successfully: {abi}")
          PYEOF

      - name: Get Version & Date Metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName\s*=\s*"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

          RAW_TAG="${{ inputs.tag_name }}"
          if [ -n "$RAW_TAG" ]; then
            FINAL_TAG="$RAW_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            FINAL_TAG="${GITHUB_REF#refs/tags/}"
          else
            FINAL_TAG="v${VERSION}-${DATE_TAG}"
          fi
          echo "final_tag=$FINAL_TAG" >> $GITHUB_ENV

      - name: Build Release APKs (Minified R8)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APKs (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ env.date_tag }}-abi_${{ inputs.abi || 'mix' }}
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.add_to_release_tag == true || inputs.add_to_release_tag == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.final_tag }}
          name: "PhotoStand ${{ env.version }} (${{ env.final_tag }})"
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          files: app/build/outputs/apk/**/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
